  grade-report-service:
    build: ./grade-report
    ports:
      - "8088:8080"
      - "9088:9088" # port for debugging purposes
    environment:
      - JAVA_TOOL_OPTIONS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9088"       # - "9088:9088" for debugging purpusses
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVICES_ACADEMINS_URL=http://academins-service:8080/api/v1/academins
      - SPRING_APPLICATION_NAME=GradeReport
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/development-db
      - SPRING_DATASOURCE_USERNAME=myuser
