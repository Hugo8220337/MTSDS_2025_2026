  assessments-service:
    build: ./assessments
    ports:
      - "8087:8080"
      - "9087:9087" # port for debugging purposes
    environment:
      - JAVA_TOOL_OPTIONS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9087"       # - "9086:9086" for debugging purpusses
