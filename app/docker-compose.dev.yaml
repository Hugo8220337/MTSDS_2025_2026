      - SPRING_MONGO_URI=mongodb://db-mongo:27017/development-db
      - SPRING_APPLICATION_NAME=assessments-planning
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/development-db
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
