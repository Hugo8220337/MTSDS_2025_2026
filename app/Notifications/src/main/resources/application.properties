spring.application.name=${SPRING_APPLICATION_NAME:Notifications}

# MongoDB Configuration
data.mongodb.uri=${SPRING_MONGO_URI:mongodb://localhost:27017/notifications-db}
spring.data.mongodb.uri=${SPRING_MONGO_URI:mongodb://localhost:27017/notifications-db}
# Create indexes from @Indexed annotations
#spring.data.mongodb.auto-index-creation=true

# Eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30

# Expose health for Eureka and Gateway
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:123}

spring.docker.compose.enabled=false


