apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: assessments-postgres
  namespace: assessments
spec:
  serviceName: assessments-postgres
  replicas: 1
  selector:
    matchLabels:
      app: assessments-postgres
  template:
    metadata:
      labels:
        app: assessments-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: assessments_db
            - name: POSTGRES_USER
              value: myuser
            - name: POSTGRES_PASSWORD
              value: secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi