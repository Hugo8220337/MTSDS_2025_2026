apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: assessments-mongo
  namespace: assessments
spec:
  serviceName: assessments-mongo
  replicas: 1
  selector:
    matchLabels:
      app: assessments-mongo
  template:
    metadata:
      labels:
        app: assessments-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          args: ["--noauth"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: assessments_logs_db
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'db.adminCommand({ ping: 1 })'
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: mongo-init
          configMap:
            name: assessments-mongo-init # Referência ao ConfigMap criado acima
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi