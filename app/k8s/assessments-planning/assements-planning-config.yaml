apiVersion: v1
kind: ConfigMap
metadata:
  name: assessments-planning-config
  namespace: assessments-planning
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://assessments-planning-postgres:5432/assessments-planning-db
  SPRING_RABBITMQ_HOST: "rabbitmq.rabbitmq.svc.cluster.local"
  SPRING_RABBITMQ_PORT: "5672"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka.eureka-server.svc.cluster.local:8761/eureka/"
  SERVICES_ACADEMINS_URL: "http://academins.academins.svc.cluster.local:8080/api/v1/academins/"
  init.sql: |
    CREATE DATABASE "assessments-planning-db";