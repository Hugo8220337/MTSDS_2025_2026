apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessments-planning-deployment
  namespace: assessments-planning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessments-planning
  template:
    metadata:
      labels:
        app: assessments-planning
    spec:
      containers:
        - name: schedules
          image: hugobpc/mtds_2025_2026-assessments-planning:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: assessments-planning-config
            - secretRef:
                name: assessments-planning-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 12
            periodSeconds: 10
            failureThreshold: 6
