apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notifications-mongo
  namespace: notifications
spec:
  serviceName: notifications-mongo
  replicas: 1
  selector:
    matchLabels:
      app: notifications-mongo
  template:
    metadata:
      labels:
        app: notifications-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          args: ["--noauth"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "notifications-db"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'db.adminCommand({ ping: 1 })'
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'db.adminCommand({ ping: 1 })'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: mongo-init
          configMap:
            name: notifications-mongo-init
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi