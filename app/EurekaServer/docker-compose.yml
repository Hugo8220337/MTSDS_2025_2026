version: '3.8'
services:
  eureka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
