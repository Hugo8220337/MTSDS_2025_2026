services:
  assessments-service:
    build: .
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_APPLICATION_NAME=Assessments
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/assessments_db
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/assessments_logs_db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=123
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - mongo
      - rabbitmq
      - eureka-server
    networks:
      - assessments-network

  postgres:
    image: postgres:15-alpine
    container_name: assessments-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: assessments_db
    ports:
      - "5433:5432" 
    networks:
      - assessments-network

  mongo:
    image: mongo:6.0
    ports:
      - "27018:27017" 
    networks:
      - assessments-network

  rabbitmq:
    image: rabbitmq:3.12.9-management-alpine
    container_name: rabbit_container
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  eureka-server:
    image: steeltoeoss/eureka-server
    ports:
      - "8761:8761"
    networks:
      - assessments-network

volumes:
  rabbitmq_data:
    driver: local

networks:
  assessments-network:
    driver: bridge